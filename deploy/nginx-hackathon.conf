# hackathon.turing-zero.com — OJ 反向代理配置
# 放置路径：/etc/nginx/sites-available/hackathon
# 启用：ln -sf /etc/nginx/sites-available/hackathon /etc/nginx/sites-enabled/hackathon
#
# 流程说明：
#   1. 先部署本文件（纯 HTTP 反代），nginx 可正常启动
#   2. 运行 certbot --nginx -d hackathon.turing-zero.com --redirect
#      certbot 会自动在本文件中追加 443 server 块和证书路径
#   3. 重载 nginx 完成 HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name hackathon.turing-zero.com;

    # 上传限制（与 OJ server MAX_CONTENT_LENGTH=256KB 对齐，留余量）
    client_max_body_size 512k;

    access_log /var/log/nginx/hackathon_access.log;
    error_log  /var/log/nginx/hackathon_error.log;

    location / {
        proxy_pass         http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # 传递真实 IP（OJ 限流依赖此头）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时：评测最长 150s，读超时设大一档
        proxy_connect_timeout  10s;
        proxy_send_timeout     20s;
        proxy_read_timeout    180s;
    }
}
