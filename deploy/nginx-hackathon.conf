# hackathon.turing-zero.com — OJ 反向代理配置
# 放置路径：/etc/nginx/sites-available/hackathon
# 启用：ln -s /etc/nginx/sites-available/hackathon /etc/nginx/sites-enabled/hackathon

# ── HTTP：强制跳转 HTTPS ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hackathon.turing-zero.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：反向代理到本地 Flask ───────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name hackathon.turing-zero.com;

    # 证书（certbot 自动填充）
    ssl_certificate     /etc/letsencrypt/live/hackathon.turing-zero.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackathon.turing-zero.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 上传限制（与 OJ server MAX_CONTENT_LENGTH=256KB 对齐，留余量）
    client_max_body_size 512k;

    # 访问日志（赛中可关闭以减少 I/O）
    access_log /var/log/nginx/hackathon_access.log;
    error_log  /var/log/nginx/hackathon_error.log;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 传递真实 IP（OJ 限流依赖此头）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时：评测最长 150s，读超时设大一档
        proxy_connect_timeout  10s;
        proxy_send_timeout     20s;
        proxy_read_timeout    180s;
    }
}
